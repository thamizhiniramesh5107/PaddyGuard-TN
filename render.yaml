services:
  - type: web
    name: paddyguard-api
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MODEL_PATH
        value: /tmp/paddyguard.pt
      - key: MODEL_URL
        sync: false
      - key: MODEL_SHA256
        value: 5acce83e74552321e01a5dceb962f69441919a18885006cbb77cbdc9e900b93f
      - key: MODEL_DOWNLOAD_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: /tmp/paddyguard.sqlite3
      - key: CORS_ORIGINS
        sync: false
      - key: APP_ENV
        value: production
      - key: HISTORY_ADMIN_TOKEN
        generateValue: true
      - key: ABSTAIN_THRESHOLD
        value: "0.55"
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_TABLE
        value: paddyguard_predictions
